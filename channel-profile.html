<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;

        }
        .course-preview {
            width: 320px;

        }

        .thumbnail-row img {
            width: 100%;
            display: block;
        }

        .profile-picture {
            width: 50px;
            display: inline-block;
            vertical-align: top;
        }    

        .profile-picture img {
            width: 100%;
            display: block;
            border-radius: 50%;

            }

            .course-info {
                width: 240px;
                display: inline-block;
                
                vertical-align: top;
            }

            .course-title {
                font-size: 16px;
                font-weight: bold;
                line-height: 22px;
                margin-top: 0px;
                margin-bottom: 8px;
            }
            .course-author,
            .course-stats {
                font-size: 14px;
                color: rgb(96, 96, 96);
                margin-top: 0;
            }

            .course-author {
                margin-bottom: 4px;
            }

            .course-stats {
                margin-bottom: 0;
                
            }
            .course-details {
                margin-top: 10px;
            }
    </style>
</head>

<body>
    <div class="course-preview">
        <div class="thumbnail-row"><img src="profile-picture.png" alt="Python course thumbnail"></div>
        
            <div class="course-details">
                <div class="profile-picture"><img src="channel-profile.png" alt="Code Academy profile"></div>
                <div class="course-info">
                    <p class="course-title">Learn Python Programming</p>
                    <p class="course-author">Code Academy</p>
                    <p class="course-stats">125K views &#183; 2 weeks ago</p>
                </div>
            




        </div>


    </div>
</body>

</html>

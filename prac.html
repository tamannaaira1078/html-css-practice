<style>
    .product-card {
        font-family:'Times New Roman', Times, serif;
        padding-top: 40px;
        padding-bottom: 40px;
        padding-left: 20px;
        padding-right: 20px;
        border: 2px solid black;
        border-radius: 8px;
        color: rgb(62, 9, 9);
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.7);
        width:300px
        
    }

    .buy-button {
        border:1px solid rgb(51, 2, 2);
        color: white;
        background-color: rgb(190, 111, 8);
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s, background-color 0.15s;
    }

    .buy-button:hover {
        background-color: rgb(96, 55, 3);
        transform: translateY(-2px);
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.7);

    }
    .buy-button:active {
        box-shadow: none;
        opacity: 0.7;
    }

</style>

<div class="product-card">
    <h2>Vanilla de Perfume</h2>
    <p>Move Fresh All day Everyday</p>
    <p>$19.99</p>
    <button class="buy-button">Buy Now</button>
</div>
